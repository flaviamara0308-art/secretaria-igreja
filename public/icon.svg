<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glowGrad)" />

  <!-- Subtle Inner Frame -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="#93c5fd" stroke-opacity="0.22" stroke-width="3" />

  <!-- Shield / Sanctuary Crest -->
  <path d="M256 64 L402 120 L402 252 C402 346 336 414 256 446 C176 414 110 346 110 252 L110 120 Z" fill="#0f172a" fill-opacity="0.38" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Sanctuary Roof Silhouette -->
  <path d="M148 258 L256 168 L364 258" fill="none" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Luminous Cross -->
  <rect x="238" y="106" width="36" height="176" rx="10" fill="url(#whiteGrad)" />
  <rect x="188" y="152" width="136" height="36" rx="10" fill="url(#whiteGrad)" />

  <!-- Open Pastoral Ledger / Book (Secretaria) -->
  <path d="M148 310 C184 294 228 298 254 316 L254 388 C228 372 184 368 148 382 Z" fill="url(#whiteGrad)" />
  <path d="M364 310 C328 294 284 298 258 316 L258 388 C284 372 328 368 364 382 Z" fill="#dbeafe" />

  <!-- Ledger Accent Lines -->
  <line x1="170" y1="332" x2="232" y2="334" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" stroke-opacity="0.45" />
  <line x1="170" y1="352" x2="226" y2="354" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />
  <line x1="280" y1="334" x2="342" y2="332" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" stroke-opacity="0.45" />
  <line x1="286" y1="354" x2="342" y2="352" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />

  <!-- Golden Book Binding & Bookmark -->
  <path d="M138 384 C178 368 228 374 256 392 C284 374 334 368 374 384 L380 398 C336 382 286 388 256 406 C226 388 176 382 132 398 Z" fill="url(#goldGrad)" />
  <path d="M248 318 L264 318 L264 416 L256 406 L248 416 Z" fill="url(#goldGrad)" />
</svg>